<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>麻雀ルール選択</title>
  <style>
    :root {
      --bg: #14342b;
      --panel: #f3efe4;
      --panel-line: #d9d2bf;
      --ink: #1c1c18;
      --ink-soft: #5c5749;
      --felt: #1f5c46;
      --felt-deep: #14342b;
      --accent: #b7472a;
      --accent-soft: #e8c9be;
      --gold: #c8a24a;
      --sel-bg: #eef3ec;
      --sel-line: #2f6b52;
      --st-done: #2f8f5b;
      /* 選択済み（緑） */
      --st-todo: #c0392b;
      /* 未選択（赤） */
      --st-check: #d9a520;
      /* 要確認（黄） */
      --radius: 4px;
      --mono: "SFMono-Regular", ui-monospace, "DejaVu Sans Mono", monospace;
      --serif: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "MS PMincho", serif;
      --sans: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--felt-deep);
      background-image:
        radial-gradient(ellipse at 50% -10%, #276b51 0%, var(--felt-deep) 60%);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.6;
      min-height: 100vh;
      padding: 0 16px 120px;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
    }

    /* home / entry screen */
    .home-inner {
      padding: 56px 0 32px;
      text-align: center;
      color: var(--panel);
    }

    .home-kana {
      font-family: var(--serif);
      letter-spacing: 0.5em;
      font-size: 13px;
      color: var(--gold);
      margin: 0 0 10px;
      padding-left: 0.5em;
    }

    .home-title {
      font-family: var(--serif);
      font-weight: 600;
      font-size: clamp(28px, 6vw, 40px);
      margin: 0;
      letter-spacing: 0.08em;
    }

    .home-lead {
      margin: 14px 0 30px;
      font-size: 13px;
      color: #cdd8cf;
    }

    .home-choices {
      display: grid;
      gap: 14px;
      max-width: 460px;
      margin: 0 auto;
    }

    .home-card {
      display: block;
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--panel-line);
      border-left: 4px solid var(--felt);
      border-radius: var(--radius);
      padding: 18px 20px;
      cursor: pointer;
      color: var(--ink);
      font-family: var(--sans);
      transition: transform .08s, box-shadow .12s, border-color .12s;
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.15);
    }

    .home-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.24);
      border-left-color: var(--gold);
    }

    .home-card:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    .home-card-name {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 19px;
      letter-spacing: 0.04em;
      display: block;
      margin-bottom: 6px;
    }

    .home-card-desc {
      font-size: 12.5px;
      color: var(--ink-soft);
      line-height: 1.5;
    }

    /* progress meter (top bar on cat/rule screens) */
    /* sticky header (meter + subnav) */
    .sticky-head {
      position: sticky;
      top: 0;
      z-index: 15;
      margin: 0 -16px;
      /* bleed to viewport edges */
      padding: 0 16px;
      background: var(--felt-deep);
      background-image: radial-gradient(ellipse at 50% -40%, #276b51 0%, var(--felt-deep) 70%);
      box-shadow: 0 6px 14px -6px rgba(0, 0, 0, 0.5);
      border-bottom: 1px solid rgba(200, 162, 74, 0.18);
    }

    .meter {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 14px;
      padding: 14px 2px 12px;
      font-family: var(--mono);
      font-size: 12px;
      color: #bcc9be;
    }

    .home-corner {
      font-size: 13px;
      padding: 6px 14px;
    }

    .tally {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .tally b {
      font-size: 15px;
    }

    .tally-total {
      color: #8ba394;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot-done {
      background: var(--st-done);
    }

    .dot-check {
      background: var(--st-check);
    }

    .dot-todo {
      background: var(--st-todo);
    }

    #doneCount {
      color: #7fd6a3;
    }

    #checkCount {
      color: #f2d27a;
    }

    #todoCount {
      color: #f0a79e;
    }

    .ver-badge {
      font-family: var(--mono);
      font-size: 11px;
      color: #221c0a;
      background: var(--gold);
      padding: 1px 7px;
      border-radius: 2px;
      margin-left: 12px;
      letter-spacing: 0.03em;
    }

    .notice {
      max-width: 760px;
      margin: 0 auto 4px;
      background: var(--panel);
      border: 1px solid var(--accent);
      border-left-width: 4px;
      border-radius: var(--radius);
      padding: 12px 16px;
      color: var(--ink);
      font-size: 13px;
      line-height: 1.6;
    }

    .notice.loading {
      border-color: var(--panel-line);
      color: var(--ink-soft);
      text-align: center;
      font-family: var(--mono);
    }

    /* category screen */
    .screen-lead {
      color: #cdd8cf;
      text-align: center;
      font-size: 13px;
      margin: 8px 0 20px;
    }

    .cat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }

    .cat-card {
      background: var(--panel);
      border: 1px solid var(--panel-line);
      border-left: 4px solid var(--felt);
      border-radius: var(--radius);
      padding: 18px 18px 16px;
      text-align: left;
      cursor: pointer;
      font-family: var(--sans);
      color: var(--ink);
      transition: transform .08s, box-shadow .12s, border-color .12s;
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.15);
    }

    .cat-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.22);
      border-left-color: var(--gold);
    }

    .cat-card:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    .cat-card[data-complete="true"] {
      border-left-color: var(--st-done);
    }

    .cat-card .cat-name {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 18px;
      letter-spacing: 0.03em;
      display: block;
      margin-bottom: 12px;
    }

    .cat-card .cat-stats {
      display: flex;
      gap: 12px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--ink-soft);
      flex-wrap: wrap;
    }

    .cat-card .cat-stats i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
      position: relative;
      top: -1px;
    }

    .cat-card .cat-done b {
      color: var(--st-done);
    }

    .cat-card .cat-check b {
      color: #a67c07;
    }

    .cat-card .cat-todo b {
      color: var(--st-todo);
    }

    .cat-card .cat-arrow {
      float: right;
      color: var(--felt);
      font-size: 18px;
    }

    /* subnav on rules screen */
    .subnav {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      padding-bottom: 12px;
    }

    .back-btn {
      background: transparent;
      color: #cdd8cf;
      border: 1px solid rgba(205, 216, 207, 0.4);
      border-radius: var(--radius);
      padding: 7px 13px;
      font-size: 13px;
      cursor: pointer;
      font-family: var(--sans);
      transition: background .12s;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.07);
    }

    .back-btn:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    .cat-heading {
      font-family: var(--serif);
      color: var(--panel);
      font-size: 19px;
      margin: 0;
      letter-spacing: 0.05em;
      flex: 1;
    }

    .sort-toggle {
      display: inline-flex;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(205, 216, 207, 0.3);
      border-radius: 999px;
      padding: 3px;
    }

    .sort-opt {
      background: transparent;
      border: none;
      color: #bcc9be;
      font-family: var(--sans);
      font-size: 12.5px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: background .12s, color .12s;
    }

    .sort-opt.is-active {
      background: var(--gold);
      color: #221c0a;
    }

    .sort-opt:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    /* readonly / writable toggle (category list header) */
    .mode-toggle {
      display: inline-flex;
      margin-left: auto;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(205, 216, 207, 0.3);
      border-radius: 999px;
      padding: 3px;
    }

    .mode-opt {
      background: transparent;
      border: none;
      color: #bcc9be;
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: background .12s, color .12s;
    }

    .mode-opt.is-active {
      background: var(--gold);
      color: #221c0a;
    }

    .mode-opt:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    .home-corner {
      margin-left: 10px;
    }

    /* when the mode toggle is present it takes the margin-left:auto, so reset the corner btn */
    .readonly-opt {
      cursor: default;
    }

    .readonly-opt:hover {
      background: transparent;
    }

    /* rule card */
    .rule {
      background: var(--panel);
      border: 1px solid var(--panel-line);
      border-radius: var(--radius);
      margin: 14px 0;
      overflow: hidden;
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.15);
    }

    .rule[data-depth="1"] {
      margin-left: 22px;
      background: #f6f2e8;
    }

    .rule[data-depth="2"] {
      margin-left: 44px;
      background: #f8f5ee;
    }

    .rule.is-group>.rule-body {
      display: none;
    }

    /* status stripe on answerable cards */
    .rule.answerable {
      position: relative;
      border-left: 4px solid var(--st-todo);
      /* default: 未選択=赤 */
    }

    .rule.answerable[data-status="done"] {
      border-left-color: var(--st-done);
    }

    .rule.answerable[data-status="todo"] {
      border-left-color: var(--st-todo);
    }

    .rule.answerable[data-status="check"] {
      border-left-color: var(--st-check);
    }

    .rule.answerable[data-status="disabled"] {
      border-left-color: #c9c3b2;
    }

    /* disabled (unmet-condition) rules: grayed out, not interactive */
    .rule.is-disabled {
      opacity: 0.55;
      filter: grayscale(0.4);
    }

    .rule.is-disabled .opt {
      cursor: not-allowed;
    }

    .rule.is-disabled .opt:hover {
      background: transparent;
    }

    .rule.is-disabled .flag-btn {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .dep-warn {
      margin: 0 18px 12px;
      background: #fbf1d3;
      border: 1px solid var(--st-check);
      border-radius: var(--radius);
      padding: 8px 12px;
      font-size: 12.5px;
      color: #8a6a10;
      font-family: var(--sans);
    }

    .dep-warn::before {
      content: "⚠ ";
    }

    .rule-info {
      margin: 0 18px 10px;
      font-size: 12px;
      color: var(--ink-soft);
      font-family: var(--sans);
      line-height: 1.5;
    }

    .rule-head {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--panel-line);
    }

    .is-group>.rule-head {
      border-bottom: none;
      padding-bottom: 8px;
    }

    .rule[data-depth="1"] .rule-head,
    .rule[data-depth="2"] .rule-head {
      padding-top: 12px;
      padding-bottom: 12px;
    }

    .rule-id {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--panel);
      background: var(--felt);
      padding: 2px 7px;
      border-radius: 2px;
      white-space: nowrap;
      letter-spacing: 0.03em;
      flex-shrink: 0;
      position: relative;
      top: -1px;
    }

    .is-group>.rule-head .rule-id {
      background: var(--accent);
    }

    .rule-title {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 16px;
      letter-spacing: 0.02em;
      color: var(--ink);
      flex: 1;
    }

    .rule[data-depth="1"] .rule-title {
      font-size: 15px;
    }

    .rule[data-depth="2"] .rule-title {
      font-size: 14px;
    }

    /* 要確認 toggle */
    .flag-btn {
      flex-shrink: 0;
      align-self: center;
      font-family: var(--sans);
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--ink-soft);
      background: transparent;
      border: 1px solid var(--panel-line);
      border-radius: 999px;
      padding: 4px 11px 4px 9px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background .12s, border-color .12s, color .12s;
    }

    .flag-btn::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--panel-line);
      transition: background .12s;
    }

    .flag-btn:hover {
      border-color: var(--st-check);
      color: var(--ink);
    }

    .flag-btn[aria-pressed="true"] {
      background: #fbf1d3;
      border-color: var(--st-check);
      color: #8a6a10;
    }

    .flag-btn[aria-pressed="true"]::before {
      background: var(--st-check);
    }

    .flag-btn:focus-visible {
      outline: 2px solid var(--st-check);
      outline-offset: 2px;
    }

    .rule-body {
      padding: 10px 18px 16px;
    }

    .opt {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 9px 12px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background .12s, border-color .12s;
    }

    .opt:hover {
      background: #ecf1ea;
    }

    .opt input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .opt .box {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border: 1.5px solid #b7b09a;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-soft);
      background: #fff;
      margin-top: 1px;
      transition: all .12s;
    }

    .opt .label {
      font-size: 14px;
      color: var(--ink);
      padding-top: 1px;
      white-space: pre-line;
    }

    .opt:has(input:checked) {
      background: var(--sel-bg);
      border-color: var(--sel-line);
    }

    .opt:has(input:checked) .box {
      background: var(--felt);
      border-color: var(--felt);
      color: #fff;
    }

    .opt:has(input:checked) .label {
      font-weight: 600;
    }

    .opt:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    .opt:focus-visible .box {
      border-color: var(--gold);
    }

    /* action bar */
    .bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(16, 32, 26, 0.92);
      backdrop-filter: blur(8px);
      border-top: 1px solid rgba(200, 162, 74, 0.35);
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }

    .bar .status {
      font-family: var(--mono);
      font-size: 12px;
      color: #bcc9be;
      margin-right: auto;
    }

    .bar-spacer {
      flex: 1;
    }

    button {
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: var(--radius);
      padding: 10px 18px;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: transform .08s, filter .12s;
    }

    button:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background: var(--gold);
      color: #221c0a;
    }

    .btn-primary:hover {
      filter: brightness(1.06);
    }

    .btn-ghost {
      background: transparent;
      color: #cdd8cf;
      border: 1px solid rgba(205, 216, 207, 0.4);
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    /* share sheet */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(10, 20, 16, 0.6);
      display: none;
      z-index: 40;
      padding: 20px;
      overflow-y: auto;
    }

    .sheet-backdrop.open {
      display: block;
    }

    .sheet {
      max-width: 640px;
      margin: 40px auto;
      background: var(--panel);
      border-radius: 6px;
      border: 1px solid var(--panel-line);
      overflow: hidden;
    }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--panel-line);
      background: var(--felt);
      color: var(--panel);
    }

    .sheet-head h2 {
      font-family: var(--serif);
      font-size: 17px;
      margin: 0;
      letter-spacing: 0.05em;
    }

    .sheet-head button {
      background: transparent;
      color: var(--panel);
      padding: 4px 8px;
    }

    .sheet-body {
      padding: 18px 20px;
    }

    .field-label {
      font-family: var(--serif);
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      margin: 0 0 8px;
      letter-spacing: 0.03em;
    }

    .field-note {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 400;
      color: var(--ink-soft);
      letter-spacing: 0;
    }

    .url-row {
      display: flex;
      gap: 8px;
    }

    .share-url {
      flex: 1;
      min-width: 0;
      font-family: var(--mono);
      font-size: 12px;
      border: 1px solid var(--panel-line);
      border-radius: var(--radius);
      padding: 10px 12px;
      background: #fbfaf5;
      color: var(--ink);
    }

    .url-row .btn-primary {
      background: var(--felt);
      color: #fff;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .qr-wrap {
      text-align: center;
      margin: 18px 0 4px;
    }

    .qr-code {
      display: inline-block;
      background: #fff;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--panel-line);
      line-height: 0;
    }

    .qr-code svg {
      display: block;
      width: 200px;
      height: 200px;
    }

    .qr-note {
      font-size: 12px;
      color: var(--ink-soft);
      margin: 10px 0 0;
      font-family: var(--sans);
    }

    .share-text {
      width: 100%;
      min-height: 240px;
      font-family: var(--mono);
      font-size: 12.5px;
      line-height: 1.7;
      border: 1px solid var(--panel-line);
      border-radius: var(--radius);
      padding: 14px;
      resize: vertical;
      background: #fbfaf5;
      color: var(--ink);
    }

    .sheet-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .sheet-actions .btn-primary {
      background: var(--felt);
      color: #fff;
    }

    .copied {
      color: var(--felt);
      font-size: 13px;
      font-weight: 600;
      align-self: center;
      margin-left: auto;
      opacity: 0;
      transition: opacity .2s;
    }

    .copied.show {
      opacity: 1;
    }

    @media (max-width: 520px) {
      .rule[data-depth="1"] {
        margin-left: 12px;
      }

      .rule[data-depth="2"] {
        margin-left: 22px;
      }

      .bar .status {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div id="notice" class="notice" hidden></div>

    <!-- top / entry screen -->
    <section id="homeScreen" hidden>
      <div class="home-inner">
        <p class="home-kana">局 ・ 規 定</p>
        <h1 class="home-title">麻雀ルール設定</h1>
        <p class="home-lead">はじめ方を選んでください。</p>
        <div class="home-choices">
          <button type="button" class="home-card" data-preset="new">
            <span class="home-card-name">新規作成</span>

    }
    function parseParam() {
      // returns { version, valueString, readonly } or null
      const q = new URLSearchParams(location.search);
      const version = q.get(PARAM_V) == null ? null : q.get(PARAM_V).split(".").slice(0, 2).join(".");
      const rawR = q.get(PARAM_R) || "";
      const valueString = rawR ? expandRuns(rawR) : "";
      const readonly = q.get(PARAM_MODE) === "ro";
      if (version == null && !valueString && !readonly) return null;
      return { version: version || "", valueString, readonly };
    }
    // buildQuery(forceReadonly): omit arg to reflect the current mode; pass true for share links.
    function buildQuery(forceReadonly) {
      const ro = (forceReadonly === undefined) ? readonly : forceReadonly;
      let q = "?" + PARAM_V + "=" + CURRENT_VERSION + "&" + PARAM_R + "=" + compressRuns(encodeValueString());
      if (ro) q += "&" + PARAM_MODE + "=ro";
      return q;
    }
    function baseHref() {
      return location.origin === "null"
        ? location.href.split(/[?#]/)[0]
        : location.origin + location.pathname;
    }
    // Share links are always readonly (閲覧専用).
    function currentShareUrl() {
      return baseHref() + buildQuery(true);
    }
    function syncUrlBar() {
      try {
        history.replaceState(null, "", location.pathname + buildQuery());
      } catch (e) { /* file:// may block; ignore */ }
    }

    /* ================= render ================= */
    // status rank for sorting: 未選択(0) → 要確認(1) → 選択済み(2)
    const STATUS_RANK = { todo: 0, check: 1, done: 2 };
    // aggregate status of a top-level rule = the "least done" of its visible answerable descendants
    function topRuleStatusRank(topRule) {
      const metas = answerableUnder(topRule).filter(m => isVisible(m));
      if (!metas.length) return 3;                 // nothing to answer (rare) — sort last
      return Math.min(...metas.map(m => STATUS_RANK[statusOf(m.fullId)]));
    }
    function answerableUnder(topRule) {
      const out = [];
      const walk = (nodes, pp) => nodes.forEach(n => {
        const f = pp ? pp + "-" + n.id : n.id;
        if (!nodeIndex[f].isGroup) out.push(nodeIndex[f]);
        if (n.children) walk(n.children, f);
      });
      walk([topRule], topRule.category);
      return out;
    }

    function render() {
      // drop 要確認 flags on items that are no longer selected or no longer visible
      for (const id of [...flagged]) {
        const meta = nodeIndex[id];
        if (!meta || selections[id] == null || !isVisible(meta)) flagged.delete(id);
      }

      const footerBar = document.getElementById("footerBar");

      if (screen === "home") {
        homeScreen.hidden = false;
        stickyHead.hidden = true;
        footerBar.hidden = true;
        catScreen.hidden = true;
        ruleScreen.hidden = true;
        try { history.replaceState(null, "", location.pathname); } catch (e) { }
        return;
      }

      homeScreen.hidden = true;
      stickyHead.hidden = false;
      const modeToggle = document.getElementById("modeToggle");
      if (activeCategory == null) {
        // category list: subnav hidden, mode toggle + home button top-right, footer only 共有
        catScreen.hidden = false;
        ruleScreen.hidden = true;
        subnav.hidden = true;
        homeCornerBtn.hidden = false;
        modeToggle.hidden = false;
        modeToggle.querySelectorAll(".mode-opt").forEach(b =>
          b.classList.toggle("is-active", b.dataset.mode === (readonly ? "ro" : "rw")));
        footerBar.hidden = true;
      } else {
        // rules screen: subnav (heading + sort) shown, footer has カテゴリ一覧 back
        catScreen.hidden = true;
        ruleScreen.hidden = false;
        subnav.hidden = false;
        homeCornerBtn.hidden = true;
        modeToggle.hidden = true;
        footerBar.hidden = false;
        renderRules();
      }
      if (activeCategory == null) renderCategoryGrid();
      updateMeter();
      syncUrlBar();
    }

    function catStats(catId) {
      let done = 0, check = 0, todo = 0;
      DATA.rules.filter(r => r.category === catId).forEach(top => {
        answerableUnder(top).filter(m => isVisible(m)).forEach(m => {
          const s = statusOf(m.fullId);
          if (s === "done") done++; else if (s === "check") check++; else todo++;
        });
      });
      return { done, check, todo, total: done + check + todo };
    }

    function renderCategoryGrid() {
      catGrid.innerHTML = "";
      const cats = DATA.categories || [];
      cats.forEach(cat => {
        const st = catStats(cat.id);
        const complete = st.total > 0 && st.todo === 0 && st.check === 0;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "cat-card";
        btn.dataset.complete = complete ? "true" : "false";
        btn.innerHTML =
          `<span class="cat-arrow">→</span>
       <span class="cat-name"></span>
       <span class="cat-stats">
         <span class="cat-done"><i class="dot dot-done"></i>選択 <b>${st.done}</b></span>
         <span class="cat-check"><i class="dot dot-check"></i>確認 <b>${st.check}</b></span>
         <span class="cat-todo"><i class="dot dot-todo"></i>未選 <b>${st.todo}</b></span>
       </span>`;
        btn.querySelector(".cat-name").textContent = cat.label;
        btn.addEventListener("click", () => { activeCategory = cat.id; computeRuleOrder(); render(); });
        catGrid.appendChild(btn);
      });
    }

    let ruleOrderCache = [];   // fixed top-rule order for the current category view

    function computeRuleOrder() {
      let tops = DATA.rules.filter(r => r.category === activeCategory);
      if (sortMode === "status") {
        tops = tops
          .map((r, i) => ({ r, i, rank: topRuleStatusRank(r) }))
          .sort((a, b) => a.rank - b.rank || a.i - b.i)
          .map(x => x.r);
      }
      ruleOrderCache = tops;
    }

    function renderRules() {
      const cat = (DATA.categories || []).find(c => c.id === activeCategory);
      catHeading.textContent = cat ? cat.label : "";
      root.innerHTML = "";
      ruleOrderCache.forEach(r => renderNode(r, r.category, 0, root));
    }
    function deselect(fullId) {
      delete selections[fullId];
      flagged.delete(fullId);   // 未選択に要確認は付かない
    }
    function statusOf(fullId) {
      if (selections[fullId] == null) return "todo";       // 未選択
      return flagged.has(fullId) ? "check" : "done";        // 要確認 / 選択済み
    }
    function renderNode(node, parentPath, depth, container) {
      const fullId = parentPath ? parentPath + "-" + node.id : node.id;
      const meta = nodeIndex[fullId];
      const gate = gateState(meta);
      const enabled = gate.enabled;
      const interactive = enabled && !readonly;   // readonly disables editing but not visibility

      const card = document.createElement("section");
      card.className = "rule" + (meta.isGroup ? " is-group" : " answerable") + (enabled ? "" : " is-disabled");
      card.dataset.depth = depth;

      const head = document.createElement("div");
      head.className = "rule-head";
      head.innerHTML = `<span class="rule-id"></span><span class="rule-title"></span>`;
      head.querySelector(".rule-id").textContent = fullId;
      head.querySelector(".rule-title").textContent = node.title;

      if (!meta.isGroup) {
        card.dataset.status = enabled ? statusOf(fullId) : "disabled";
        const flagBtn = document.createElement("button");
        flagBtn.className = "flag-btn";
        flagBtn.type = "button";
        flagBtn.textContent = "要確認";
        flagBtn.disabled = !interactive;
        // in readonly, hide the flag toggle unless it's actually flagged (keep it as a static mark)
        if (readonly && !flagged.has(fullId)) flagBtn.hidden = true;
        flagBtn.setAttribute("aria-pressed", flagged.has(fullId) ? "true" : "false");
        flagBtn.addEventListener("click", () => {
          if (!interactive) return;
          if (flagged.has(fullId)) flagged.delete(fullId);
          else flagged.add(fullId);
          render();
        });
        head.appendChild(flagBtn);
      }
      card.appendChild(head);

      // metadata / note (from v2): show 別名・意味 etc. compactly
      if (node.meta || node.note) {
        const info = document.createElement("div");
        info.className = "rule-info";
        const bits = [];
        if (node.meta) {
          const m = node.meta;
          if (m.alias) bits.push(`別名：${asText(m.alias)}`);
          if (m.meaning) bits.push(asText(m.meaning));
          if (m.content) bits.push(asText(m.content));
          if (m.condition) bits.push(`条件：${asText(m.condition)}`);
        }
        if (node.note) bits.push(asText(node.note));
        info.textContent = bits.join(" ／ ");
        if (bits.length) card.appendChild(info);
      }

      // dep-missing warning (only for external dependency references)
      if (!enabled && gate.depMissing) {
        const warn = document.createElement("div");
        warn.className = "dep-warn";
        warn.textContent = `「${gate.depMissing.title}」（${gate.depMissing.targetId}）を先に選んでください`;
        card.appendChild(warn);
      }

      if (!meta.isGroup) {
        const body = document.createElement("div");
        body.className = "rule-body";
        node.options.forEach(opt => {
          const lab = document.createElement("label");
          lab.className = "opt";
          const checked = selections[fullId] === opt.value;
          lab.innerHTML =
            `<input type="radio" tabindex="-1" name="r-${fullId}" value="${opt.value}" ${checked ? "checked" : ""} ${interactive ? "" : "disabled"}>
         <span class="box">${opt.value}</span><span class="label"></span>`;
          const labelText = opt.detail
            ? `${opt.label}\n${asText(opt.detail)}`
            : opt.label;
          lab.querySelector(".label").textContent = labelText;
          lab.setAttribute("role", "radio");
          lab.setAttribute("aria-checked", checked ? "true" : "false");

          if (interactive) {
            lab.tabIndex = 0;
            const toggle = () => {
              if (selections[fullId] === opt.value) deselect(fullId);
              else selections[fullId] = opt.value;
              render();
            };
            lab.addEventListener("click", e => { e.preventDefault(); toggle(); });
            lab.addEventListener("keydown", e => {
              if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggle(); }
            });
          } else {
            lab.setAttribute("aria-disabled", "true");
            if (readonly) lab.classList.add("readonly-opt");
          }
          body.appendChild(lab);
        });
        card.appendChild(body);
      }
      container.appendChild(card);

      if (node.children && node.children.length) {
        node.children.forEach(c => renderNode(c, fullId, depth + 1, container));
      }
    }
    // meta/note/detail values may be a string or an array of strings
    function asText(v) { return Array.isArray(v) ? v.join(" ／ ") : v; }

    /* ================= meter ================= */
    function visibleAnswerable() {
      return orderedAnswerable.filter(m => isVisible(m));
    }
    function updateMeter() {
      const vis = visibleAnswerable();
      let done = 0, check = 0, todo = 0;
      vis.forEach(m => {
        const s = statusOf(m.fullId);
        if (s === "done") done++; else if (s === "check") check++; else todo++;
      });
      document.getElementById("doneCount").textContent = done;
      document.getElementById("checkCount").textContent = check;
      document.getElementById("todoCount").textContent = todo;
      const totalEl = document.getElementById("totalCount");
      if (totalEl) totalEl.textContent = vis.length;
    }

    /* ================= share text ================= */
    function buildShareText() {
      const lines = ["【採用ルール】", `（バージョン ${CURRENT_VERSION}）`, ""];
      function walk(nodes, parentPath, depth) {
        nodes.forEach(node => {
          const fullId = parentPath ? parentPath + "-" + node.id : node.id;
          const meta = nodeIndex[fullId];
          if (!isEnabled(meta)) return;   // grayed-out (unmet condition) rules are omitted
          const indent = "  ".repeat(depth);
          if (meta.isGroup) {
            lines.push(`${indent}■ ${fullId}　${node.title}`);
          } else {
            const val = selections[fullId];
            const opt = node.options.find(o => o.value === val);
            const mark = flagged.has(fullId) ? "　【要確認】" : "";
            lines.push(`${indent}${fullId}　${node.title}`);
            lines.push(`${indent}   → ${opt ? opt.label : "（未選択）"}${mark}`);
          }
          if (node.children) walk(node.children, fullId, depth + 1);
        });
      }
      (DATA.categories || [{ id: null, label: "" }]).forEach(cat => {
        const inCat = DATA.rules.filter(r => r.category === cat.id);
        if (!inCat.length) return;
        lines.push(`◆ ${cat.label}`);
        walk(inCat, cat.id, 0);
        lines.push("");
      });
      return lines.join("\n").trimEnd();
    }

    /* ================= events ================= */
    const sheet = document.getElementById("sheet");
    document.getElementById("shareBtn").addEventListener("click", () => {
      const url = currentShareUrl();
      document.getElementById("shareText").value = buildShareText();
      document.getElementById("shareUrl").value = url;
      renderQr(url);
      sheet.classList.add("open");
    });
    // Render a QR code (byte mode, EC level L for capacity) for the given URL.
    function renderQr(url) {
      const box = document.getElementById("qrCode");
      if (!box) return;
      try {
        const qr = qrcode(0, "Q");   // typeNumber 0 = auto-fit; Q = balanced error correction
        qr.addData(url);
        qr.make();
        // cellSize/margin chosen so the SVG scales cleanly; CSS fixes the display size
        box.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 8, scalable: true });
        box.dataset.error = "";
      } catch (e) {
        box.innerHTML = "";
        box.dataset.error = "QRコードを生成できませんでした";
        box.textContent = "QRコードを生成できませんでした";
      }
    }
    async function copyValue(el, msgEl) {
      try { await navigator.clipboard.writeText(el.value); }
      catch { el.select(); document.execCommand("copy"); }
      msgEl.classList.add("show");
      setTimeout(() => msgEl.classList.remove("show"), 1600);
    }
    document.getElementById("copyUrlBtn").addEventListener("click", () =>
      copyValue(document.getElementById("shareUrl"), document.getElementById("copiedUrlMsg")));
    document.getElementById("copyBtn").addEventListener("click", () =>
      copyValue(document.getElementById("shareText"), document.getElementById("copiedMsg")));
    function closeSheet() { sheet.classList.remove("open"); }
    document.getElementById("closeSheet").addEventListener("click", closeSheet);
    document.getElementById("closeSheet2").addEventListener("click", closeSheet);
    sheet.addEventListener("click", e => { if (e.target === sheet) closeSheet(); });
    // footer back button: goes up one level (rules → categories → home)
    // footer back (rules screen only): return to category list
    document.getElementById("footerBackBtn").addEventListener("click", () => {
      activeCategory = null;
      render();
    });
    // top-right button on the category list: back to the top (entry) screen
    document.getElementById("homeCornerBtn").addEventListener("click", () => {
      screen = "home";
      activeCategory = null;
      render();
    });
    // readonly / writable toggle (category list). Reflected into the URL via syncUrlBar().
    document.querySelectorAll("#modeToggle .mode-opt").forEach(btn => {
      btn.addEventListener("click", () => {
        readonly = (btn.dataset.mode === "ro");
        render();
      });
    });
    // top-screen preset choices
    // TODO: fill in real preset value strings for 一般ルール / 雀魂ルール.
    const PRESETS = {
      "new": "",   // 新規作成 — すべて未選択
      "ippan": "",   // 一般ルール — TODO: プリセットの値列を設定
      "jantama": ""    // 雀魂ルール — TODO: プリセットの値列を設定
    };
    document.querySelectorAll(".home-card").forEach(card => {
      card.addEventListener("click", () => {
        const preset = card.dataset.preset;
        const valueString = PRESETS[preset] || "";
        // clear current state, then apply the preset's value string
        for (const k in selections) delete selections[k];
        flagged.clear();
        if (valueString) applyValueString(valueString);
        readonly = false;            // presets open in editable mode
        screen = "categories";
        activeCategory = null;
        render();
      });
    });
    // sort mode toggle
    document.querySelectorAll(".sort-opt").forEach(btn => {
      btn.addEventListener("click", () => {
        sortMode = btn.dataset.sort;
        document.querySelectorAll(".sort-opt").forEach(b =>
          b.classList.toggle("is-active", b === btn));
        if (activeCategory != null) { computeRuleOrder(); renderRules(); }
      });
    });

    /* ================= boot ================= */
    async function fetchJson(url) {
      const res = await fetch(url, { cache: "no-cache" });
      if (!res.ok) throw new Error(`${url} (${res.status})`);
      return res.json();
    }
    function finalize(data, requested, versionForBadge, noticeHtml) {
      DATA = data;
      CURRENT_VERSION = DATA.version || versionForBadge;
      // Each top-level rule's full id begins with its category (e.g. "8-15").
      DATA.rules.forEach(r => indexTree([r], r.category));
      DATA.rules.forEach(r => buildOrder([r], r.category));

      if (requested && requested.valueString) applyValueString(requested.valueString);
      readonly = !!(requested && requested.readonly);

      // Entry point: a URL carrying params (shared link / preset) skips the top screen;
      // a bare visit starts at the top (entry) screen.
      screen = (requested && (requested.version || requested.valueString || requested.readonly)) ? "categories" : "home";

      const badge = document.getElementById("verBadge");
      badge.hidden = false;
      badge.textContent = "v" + CURRENT_VERSION;

      if (noticeHtml) showNotice(noticeHtml, ""); else hideNotice();
      render();
    }
    async function boot() {
      showNotice("ルールデータを読み込み中…", "loading");
      const requested = parseParam();  // { version, valueString } or null

      const manifest = await fetchJson("rules/manifest.json");
      const latest = manifest.latest;
      const known = manifest.versions;
      let version = (requested && requested.version) ? requested.version : latest;
      let notice = "";

      if (requested && requested.version && !known.includes(requested.version)) {
        notice =
          `共有リンクのバージョン「${requested.version}」は見つかりませんでした。` +
          `最新バージョン（${latest}）で表示します。選択内容は復元されていません。`;
        version = latest;
        requested.valueString = "";
      }

      try {
        const data = await fetchJson(versionUrl(version));
        finalize(data, requested, version, notice);
      } catch (e) {
        showNotice(`バージョン ${version} のルールデータを読み込めませんでした。`, "");
      }
    }
    boot();
  </script>
</body>

</html>
